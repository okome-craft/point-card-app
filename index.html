<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Point Card</title>
<style>
  :root {
    --primary:#ff6b9d; --primary-dark:#ff4b80; --primary-shadow:rgba(255,107,157,.4);
    --primary-ring:rgba(255,107,157,.12); --header-bg:linear-gradient(135deg,#ff6b9d,#ff9a9e);
    --secondary:#ffd93d; --accent:#6bcb77; --bg:#dbeeff; --text:#4a4a4a; --radius:20px;
  }
  body.bg-sky    { --bg:#dbeeff; --primary:#3d8fc4; --primary-dark:#2a72a0; --primary-shadow:rgba(61,143,196,.4);  --primary-ring:rgba(61,143,196,.12);  --header-bg:linear-gradient(135deg,#3d8fc4,#6eb5df); }
  body.bg-yellow { --bg:#fff9e0; --primary:#c48a14; --primary-dark:#a87200; --primary-shadow:rgba(196,138,20,.4);  --primary-ring:rgba(196,138,20,.12);  --header-bg:linear-gradient(135deg,#c48a14,#e8b040); }
  body.bg-pink   { --bg:#ffe8f2; --primary:#ff6b9d; --primary-dark:#ff4b80; --primary-shadow:rgba(255,107,157,.4); --primary-ring:rgba(255,107,157,.12); --header-bg:linear-gradient(135deg,#ff6b9d,#ff9a9e); }

  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Hiragino Maru Gothic Pro','BIZ UDPGothic',sans-serif; background:var(--bg); color:var(--text); min-height:100dvh; overflow-x:hidden; }

  /* HEADER */
  .app-header { background:var(--header-bg); padding:14px 20px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 3px 12px var(--primary-shadow); position:sticky; top:0; z-index:100; }
  .app-title { color:white; font-size:20px; font-weight:bold; letter-spacing:.05em; text-shadow:0 2px 4px rgba(0,0,0,.1); }
  .settings-btn { background:none; border:none; border-radius:50%; width:40px; height:40px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .2s; padding:0; flex-shrink:0; }
  .settings-btn:active { transform:scale(.88); }

  /* MAIN VIEW */
  #main-view { padding:20px 16px 150px; }
  .counter-area { text-align:center; margin-bottom:14px; }
  .counter-label { font-size:13px; color:#999; margin-bottom:4px; }
  .counter-main { font-size:36px; font-weight:bold; color:var(--primary); line-height:1; }
  .counter-main span { font-size:15px; color:#bbb; font-weight:normal; }
  .next-reward-hint { font-size:13px; color:#888; margin-top:6px; }
  .next-reward-hint strong { color:var(--primary); }

  /* CARD */
  .card-wrapper { display:flex; justify-content:center; perspective:1000px; }
  .stamp-card { box-shadow:0 8px 28px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.08); display:flex; flex-direction:column; overflow:hidden; transition:box-shadow .2s; flex-shrink:0; }
  .card-header-row { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .card-title { color:white; font-weight:bold; text-shadow:0 1px 3px rgba(0,0,0,.2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:60%; }
  .card-total { background:rgba(255,255,255,.3); color:white; border-radius:20px; white-space:nowrap; flex-shrink:0; }
  .card-grid-area { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .stamp-grid { display:grid; }

  /* STAMP CELLS */
  .stamp-cell { border-radius:50%; background:white; display:flex; align-items:center; justify-content:center; position:relative; border:2px solid #c8a850; transition:transform .1s; overflow:visible; flex-shrink:0; }
  .stamp-cell.has-reward { overflow:hidden; }
  .stamp-cell.stamped { box-shadow:inset 0 1px 4px rgba(0,0,0,.06); }
  .stamp-icon { opacity:0; transform:scale(0); display:flex; align-items:center; justify-content:center; position:relative; z-index:2; flex-shrink:0; }
  .stamp-cell.stamped .stamp-icon { opacity:1; transform:scale(1); }
  .stamp-cell.just-stamped .stamp-icon { animation:stampIn .5s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes stampIn { 0%{opacity:0;transform:scale(2.5) rotate(-15deg);} 60%{opacity:1;transform:scale(.85) rotate(5deg);} 80%{transform:scale(1.1) rotate(-3deg);} 100%{opacity:1;transform:scale(1) rotate(0);} }

  /* REWARD CELL */
  .reward-silhouette { position:absolute; opacity:.18; user-select:none; pointer-events:none; z-index:1; display:flex; align-items:center; justify-content:center; }
  .reward-cell-text { position:absolute; inset:4%; display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.25; color:#1a1a1a; overflow:hidden; word-break:break-word; overflow-wrap:break-word; pointer-events:none; font-weight:700; z-index:3; text-shadow:-1px -1px 0 rgba(255,255,255,.95),1px -1px 0 rgba(255,255,255,.95),-1px 1px 0 rgba(255,255,255,.95),1px 1px 0 rgba(255,255,255,.95),0 0 5px rgba(255,255,255,.8); }
  .reward-tooltip { display:none; position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%); background:rgba(0,0,0,.78); color:white; border-radius:8px; padding:5px 10px; font-size:12px; white-space:normal; z-index:20; pointer-events:none; width:140px; text-align:center; line-height:1.4; }
  .reward-tooltip::after { content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:5px solid transparent; border-top-color:rgba(0,0,0,.78); }
  .stamp-cell.tooltip-visible .reward-tooltip { display:block; }

  /* CARD COMPLETE */
  .card-complete-banner { background:linear-gradient(135deg,#ffd93d,#ffb347); border-radius:14px; padding:10px 16px; text-align:center; margin-top:12px; font-size:14px; font-weight:bold; color:#7a4f00; display:none; }
  .card-complete-banner.visible { display:block; }

  /* REWARD STATUS */
  .reward-status-section { margin-top:14px; }
  .reward-status-heading { font-size:12px; font-weight:bold; color:#aaa; text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px; }
  .reward-status-item { background:white; border-radius:14px; padding:10px 12px; margin-bottom:8px; display:flex; align-items:center; gap:10px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
  .rs-icon { width:36px; height:36px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .rs-info { flex:1; min-width:0; }
  .rs-name { font-size:13px; font-weight:bold; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rs-meta { font-size:11px; color:#aaa; margin-top:2px; }
  .rs-count-badge { font-size:13px; font-weight:bold; color:var(--primary); flex-shrink:0; white-space:nowrap; }
  .rs-count-badge.rs-count-zero { color:#ccc; }
  .use-btn { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; border:none; border-radius:20px; padding:7px 13px; font-size:12px; font-weight:bold; cursor:pointer; transition:all .15s; white-space:nowrap; flex-shrink:0; box-shadow:0 2px 8px var(--primary-shadow); }
  .use-btn:disabled { background:#e0e0e0; color:#bbb; cursor:not-allowed; box-shadow:none; }
  .use-btn:not(:disabled):active { transform:scale(.92); }

  /* TOAST */
  .mini-toast { position:fixed; bottom:180px; left:50%; transform:translateX(-50%) translateY(16px); background:rgba(30,30,30,.82); color:white; padding:10px 20px; border-radius:24px; font-size:13px; font-weight:bold; z-index:400; opacity:0; transition:opacity .25s,transform .25s; white-space:nowrap; pointer-events:none; }
  .mini-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* STAMP BUTTON */
  .stamp-btn-area { position:fixed; bottom:0; left:0; right:0; padding:16px 20px 32px; background:linear-gradient(to top,var(--bg) 70%,transparent); display:flex; justify-content:center; z-index:50; pointer-events:none; }
  .stamp-btn { width:115px; height:115px; border-radius:50%; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; box-shadow:0 8px 24px var(--primary-shadow),0 0 0 6px var(--primary-ring); transition:transform .1s,box-shadow .1s; position:relative; overflow:hidden; background:linear-gradient(145deg,var(--primary),var(--primary-dark)); pointer-events:auto; }
  .stamp-btn::before { content:''; position:absolute; inset:0; background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.35),transparent 60%); border-radius:50%; }
  .stamp-btn-icon { display:flex; align-items:center; justify-content:center; position:relative; z-index:1; }
  .stamp-btn-label { font-size:11px; color:white; font-weight:bold; letter-spacing:.05em; position:relative; z-index:1; text-shadow:0 1px 3px rgba(0,0,0,.2); }
  .stamp-btn:active { transform:scale(.88); box-shadow:0 3px 10px var(--primary-shadow); }
  .stamp-btn.pressing { animation:btnPress .3s ease; }
  @keyframes btnPress { 0%{transform:scale(1);}40%{transform:scale(.85);}70%{transform:scale(1.05);}100%{transform:scale(1);} }
  .ripple { position:absolute; border-radius:50%; background:rgba(255,255,255,.45); transform:scale(0); animation:rippleAnim .6s linear; pointer-events:none; }
  @keyframes rippleAnim { to{transform:scale(4);opacity:0;} }

  /* CONFETTI */
  #confetti-container { position:fixed; inset:0; pointer-events:none; z-index:200; overflow:hidden; }
  .confetti-piece { position:absolute; border-radius:3px; top:-20px; animation:confettiFall linear forwards; }
  @keyframes confettiFall { 0%{transform:translateY(0) rotate(0);opacity:1;} 80%{opacity:1;} 100%{transform:translateY(110vh) rotate(720deg) translateX(var(--drift));opacity:0;} }

  /* MODAL */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:300; padding:20px; opacity:0; transition:opacity .3s; }
  .modal-overlay.visible { opacity:1; }
  .modal-box { background:white; border-radius:28px; padding:32px 24px; text-align:center; max-width:340px; width:100%; transform:scale(.7) translateY(30px); transition:transform .4s cubic-bezier(.34,1.56,.64,1); box-shadow:0 20px 60px rgba(0,0,0,.2); }
  .modal-overlay.visible .modal-box { transform:scale(1) translateY(0); }
  .modal-icon { margin-bottom:12px; display:flex; justify-content:center; }
  .modal-title { font-size:22px; font-weight:bold; color:var(--primary); margin-bottom:8px; }
  .modal-reward { font-size:17px; color:var(--text); margin-bottom:24px; line-height:1.5; }
  .modal-btn { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; border:none; border-radius:50px; padding:14px 36px; font-size:16px; font-weight:bold; cursor:pointer; box-shadow:0 4px 14px var(--primary-shadow); transition:transform .15s; }
  .modal-btn:active { transform:scale(.95); }

  /* PARTICLES */
  .particle { position:fixed; pointer-events:none; font-size:22px; z-index:150; animation:particleFly .9s ease-out forwards; }
  @keyframes particleFly { 0%{transform:translate(0,0) scale(1);opacity:1;} 100%{transform:translate(var(--px),var(--py)) scale(.3);opacity:0;} }

  /* SETTINGS VIEW */
  #settings-view { display:none; padding:20px 16px calc(40px + env(safe-area-inset-bottom,0px)); }
  #settings-view.active { display:block; }
  #main-view.hidden { display:none; }
  .settings-section { background:white; border-radius:var(--radius); padding:16px; margin-bottom:16px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .settings-section h3 { font-size:14px; font-weight:bold; color:#888; text-transform:uppercase; letter-spacing:.08em; margin-bottom:12px; }
  .form-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .form-row label { font-size:14px; min-width:90px; color:var(--text); }
  .form-input { flex:1; border:2px solid #eee; border-radius:12px; padding:8px 12px; font-size:14px; font-family:inherit; outline:none; transition:border-color .2s; }
  .form-input:focus { border-color:var(--primary); }

  /* picker grids */
  .picker-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(52px,1fr)); gap:8px; }
  .picker-item { aspect-ratio:1; border-radius:14px; border:3px solid transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:24px; transition:transform .15s,border-color .15s; background:#f5f5f5; }
  .picker-item:active { transform:scale(.9); }
  .picker-item.selected { border-color:var(--primary); transform:scale(1.06); }
  .picker-item.theme-swatch { font-size:0; }

  /* orientation picker */
  .orientation-picker { display:flex; gap:8px; }
  .orient-btn { flex:1; padding:12px 8px; border-radius:12px; border:2px solid #eee; background:#f5f5f5; font-size:14px; cursor:pointer; font-family:inherit; transition:all .15s; color:#888; }
  .orient-btn:active { transform:scale(.95); }
  .orient-btn.selected { border-color:var(--primary); background:white; color:var(--primary); font-weight:bold; }

  /* cols picker */
  .cols-picker { display:flex; gap:8px; }
  .cols-btn { flex:1; padding:11px 0; border-radius:12px; border:2px solid #eee; background:#f5f5f5; font-size:16px; font-weight:bold; cursor:pointer; color:#888; transition:all .15s; font-family:inherit; }
  .cols-btn:active { transform:scale(.92); }
  .cols-btn.selected { border-color:var(--primary); background:white; color:var(--primary); }

  /* bg swatches */
  .bg-swatch-sky    { background:linear-gradient(135deg,#b8daff,#dbeeff); }
  .bg-swatch-yellow { background:linear-gradient(135deg,#ffe082,#fff9e0); }
  .bg-swatch-pink   { background:linear-gradient(135deg,#ffb3cc,#ffe8f2); }

  /* reward list */
  .reward-list { display:flex; flex-direction:column; gap:8px; }
  .reward-item { display:flex; align-items:center; gap:8px; background:#f9f9f9; border-radius:12px; padding:8px 10px; flex-wrap:wrap; }
  .reward-count-badge { background:var(--secondary); border-radius:20px; padding:3px 9px; font-size:13px; font-weight:bold; white-space:nowrap; min-width:46px; text-align:center; }
  .reward-icon-preview { width:32px; height:32px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .reward-text { flex:1; font-size:14px; min-width:0; }
  .reward-edit-btn,.reward-del-btn { background:none; border:none; font-size:18px; cursor:pointer; padding:2px 4px; border-radius:6px; transition:background .15s; }
  .reward-del-btn:active { background:#ffe0e0; }
  .reward-edit-btn:active { background:#e8f4ff; }
  .reward-item .inline-edit { display:none; flex-basis:100%; flex-direction:column; gap:6px; }
  .reward-item.editing .inline-edit { display:flex; }
  .reward-item.editing .reward-text,.reward-item.editing .reward-edit-btn { display:none; }
  .inline-edit-inputs { display:flex; gap:6px; align-items:center; }
  .inline-edit input { border:2px solid var(--primary); border-radius:8px; padding:4px 8px; font-size:13px; outline:none; font-family:inherit; }
  .inline-save-btn { background:var(--primary); color:white; border:none; border-radius:8px; padding:5px 10px; font-size:13px; cursor:pointer; white-space:nowrap; }
  .add-reward-row { display:grid; grid-template-columns:72px 1fr auto; gap:8px; align-items:center; }
  .add-btn { background:linear-gradient(135deg,var(--accent),#4db85e); color:white; border:none; border-radius:12px; padding:10px 14px; font-size:20px; cursor:pointer; transition:transform .15s; }
  .add-btn:active { transform:scale(.9); }

  /* icon picker grid */
  .icon-picker-grid { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .icon-pick-btn { width:44px; height:44px; border-radius:12px; border:3px solid transparent; cursor:pointer; padding:0; background:none; transition:all .15s; display:flex; align-items:center; justify-content:center; }
  .icon-pick-btn.selected { border-color:var(--primary); transform:scale(1.08); }
  .icon-pick-btn:active { transform:scale(.9); }
  .icon-pick-label { font-size:10px; color:#aaa; text-align:center; margin-top:2px; }
  .icon-pick-item { display:flex; flex-direction:column; align-items:center; cursor:pointer; }

  /* cell style settings */
  .cell-style-preview { display:flex; justify-content:center; gap:20px; margin-bottom:14px; padding:14px; background:#f5f5f5; border-radius:12px; }
  .cell-preview-item { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .cell-preview-cell { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:bold; color:#666; }
  .cell-preview-label { font-size:11px; color:#888; }
  .cell-style-presets { display:flex; gap:8px; margin-bottom:14px; }
  .preset-btn { flex:1; padding:8px 4px; border:2px solid #eee; border-radius:10px; background:#f5f5f5; font-size:13px; cursor:pointer; font-family:inherit; color:#666; transition:all .15s; }
  .preset-btn:active { transform:scale(.95); background:white; }
  .cell-type-tabs { display:flex; margin-bottom:12px; border-radius:10px; overflow:hidden; border:2px solid #eee; }
  .cell-type-tab { flex:1; padding:8px 4px; border:none; background:#f5f5f5; font-size:13px; cursor:pointer; font-family:inherit; color:#888; transition:all .15s; }
  .cell-type-tab.active { background:white; color:var(--primary); font-weight:bold; }
  .cell-option-row { margin-bottom:12px; }
  .cell-option-label { font-size:13px; color:#888; margin-bottom:6px; }
  .cell-option-btns { display:flex; gap:6px; flex-wrap:wrap; }
  .cell-option-btn { padding:7px 11px; border:2px solid #eee; border-radius:8px; background:#f5f5f5; font-size:13px; cursor:pointer; font-family:inherit; color:#666; transition:all .15s; }
  .cell-option-btn.selected { border-color:var(--primary); background:white; color:var(--primary); font-weight:bold; }
  .cell-option-btn:active { transform:scale(.92); }
  .cell-color-btn { width:34px; height:34px; border-radius:50%; border:3px solid #e0e0e0; cursor:pointer; transition:transform .15s,border-color .15s; flex-shrink:0; }
  .cell-color-btn.selected { border-color:var(--primary) !important; transform:scale(1.15); }
  .cell-color-btn:active { transform:scale(.9); }
  .contrast-warning { font-size:12px; color:#e07800; margin-top:6px; display:none; padding:6px 8px; background:#fff8ee; border-radius:8px; }
  .contrast-warning.visible { display:block; }
  .reset-defaults-btn { display:block; width:100%; background:white; color:#888; border:2px solid #eee; border-radius:10px; padding:9px; font-size:13px; cursor:pointer; margin-top:12px; font-family:inherit; transition:background .15s; }
  .reset-defaults-btn:active { background:#f5f5f5; }

  .save-settings-btn { display:block; width:100%; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; border:none; border-radius:50px; padding:16px; font-size:17px; font-weight:bold; cursor:pointer; margin-top:8px; box-shadow:0 4px 14px var(--primary-shadow); transition:transform .15s; }
  .save-settings-btn:active { transform:scale(.97); }
  .danger-btn { display:block; width:100%; background:white; color:#e05; border:2px solid #fcc; border-radius:50px; padding:13px; font-size:15px; cursor:pointer; margin-top:8px; transition:background .15s; }
  .danger-btn:active { background:#fff0f3; }

  /* CARD THEMES */
  .theme-pink    { background:linear-gradient(135deg,#ff9a9e,#ff6b9d); }
  .theme-blue    { background:linear-gradient(135deg,#a8edea,#4ecdc4); }
  .theme-yellow  { background:linear-gradient(135deg,#ffd93d,#ffa940); }
  .theme-purple  { background:linear-gradient(135deg,#c2a8ff,#9b72ff); }
  .theme-green   { background:linear-gradient(135deg,#b7e4a0,#6bcb77); }
  .theme-rainbow { background:linear-gradient(135deg,#ff9a9e,#ffd93d,#6bcb77,#4ecdc4,#c2a8ff); }
  .theme-mint    { background:linear-gradient(135deg,#d4fc79,#96e6a1); }
  .theme-peach   { background:linear-gradient(135deg,#ffecd2,#fcb69f); }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-title" id="app-title">Point Card</div>
  <button class="settings-btn" id="settings-toggle" aria-label="設定"></button>
</header>

<div id="main-view">
  <div class="counter-area">
    <div class="counter-label">現在のスタンプ数</div>
    <div class="counter-main" id="counter-display">0 <span>個</span></div>
    <div class="next-reward-hint" id="next-reward-hint"></div>
  </div>
  <div class="card-wrapper">
    <div class="stamp-card" id="stamp-card">
      <div class="card-header-row" id="card-header-row">
        <span class="card-title" id="card-title-el">Point Card</span>
        <span class="card-total" id="card-total-label">0 / 10</span>
      </div>
      <div class="card-grid-area">
        <div class="stamp-grid" id="stamp-grid"></div>
      </div>
    </div>
  </div>
  <div class="card-complete-banner" id="card-complete-banner">🎊 カードがいっぱいになりました！次のカードへ進みます ✨</div>
  <div class="reward-status-section" id="reward-status"></div>
</div>

<div id="settings-view">
  <div class="settings-section">
    <h3>カードの設定</h3>
    <div class="form-row">
      <label>カードの名前</label>
      <input type="text" class="form-input" id="card-name-input" placeholder="Point Card">
    </div>
    <div class="form-row">
      <label>マス数</label>
      <input type="number" class="form-input" id="card-size-input" min="3" max="50" value="10">
      <span style="font-size:13px;color:#aaa;">個</span>
    </div>
  </div>
  <div class="settings-section">
    <h3>カードの向き</h3>
    <div class="orientation-picker" id="orientation-picker"></div>
  </div>
  <div class="settings-section">
    <h3>横のマス数</h3>
    <div class="cols-picker" id="cols-picker"></div>
  </div>
  <div class="settings-section">
    <h3>マスのスタイル</h3>
    <div id="cell-style-container"></div>
  </div>
  <div class="settings-section">
    <h3>カードのテーマ</h3>
    <div class="picker-grid" id="theme-picker"></div>
  </div>
  <div class="settings-section">
    <h3>背景色</h3>
    <div class="picker-grid" id="bg-picker"></div>
  </div>

function iconSVG(id, { size=40, badge=true, gray=false } = {}) {
  const grayStyle = gray ? ' style="filter:grayscale(1)"' : '';
  let bg = '', art = '';

    bg = badge ? `<circle cx="20" cy="20" r="18.5" fill="${ICON_ART[id].bg}"/>` : '';
    art = ICON_ART[id].d;
  } else {
    bg = badge ? `<circle cx="20" cy="20" r="18.5" fill="#eee"/>` : '';
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="${size}" height="${size}"${grayStyle}>${bg}${art}</svg>`;
}

const EMOJI_TO_ICON = { '☕':'coffee','🎁':'gift','🧳':'airplane','🌸':'flower','💆':'flower','🛍️':'shirt','🍵':'coffee','🎂':'gift','🎵':'star','🏖️':'airplane','❤️':'gift','⭐':'star' };

// ====== DEFAULT STATE ======
const DEFAULT_STATE = {

// ====== STATE ======
let state = loadState();

function loadState() {
  try {
    const saved = localStorage.getItem('kashikari-state');
    if (saved) {
      const parsed = JSON.parse(saved);
      const sc = parsed.stampCount || 0;

      // migrate rewards: silhouette→iconId
      const rewards = (parsed.rewards || DEFAULT_STATE.rewards).map(r => ({
        usedCount:0, ...r,
        iconId: r.iconId || EMOJI_TO_ICON[r.silhouette] || 'gift',
        earnedCount: r.earnedCount !== undefined ? r.earnedCount : Math.floor(sc / r.count),
      }));

      const stampIcons = parsed.stampIcons || {};

      // migrate cellStyle
      const defaultCS = DEFAULT_STATE.cellStyle;
      const cellStyle = parsed.cellStyle ? {
        normal: { ...defaultCS.normal, ...parsed.cellStyle.normal },
        reward: { ...defaultCS.reward, ...parsed.cellStyle.reward },
      } : { normal:{...defaultCS.normal}, reward:{...defaultCS.reward} };

      return {
        ...DEFAULT_STATE, ...parsed,
        cardName:        parsed.cardName        || 'Point Card',
        cardOrientation: parsed.cardOrientation || 'landscape',
        rewards, stampIcons, cellStyle,
        history: parsed.history || [],
      };
    }
  } catch(e) {}
  return {
    ...DEFAULT_STATE,
    rewards: DEFAULT_STATE.rewards.map(r => ({...r})),
    cellStyle:{
      normal:{...DEFAULT_STATE.cellStyle.normal},
      reward:{...DEFAULT_STATE.cellStyle.reward},
    },
    stampIcons:{},
  };
}

function saveState() {
  localStorage.setItem('kashikari-state', JSON.stringify(state));
}

// ====== STAMP ICON HELPERS ======
function getNextReward() {
  if (!state.rewards.length) return null;
  let best = null, bestNext = Infinity;
  state.rewards.forEach(r => {
    if (r.count <= 0) return;
    const next = Math.ceil((state.stampCount + 1) / r.count) * r.count;
    if (next < bestNext || (next === bestNext && r.count > (best ? best.count : 0))) {
      bestNext = next; best = r;
    }
  });
  return best;
}

function getStampIconForCell(absoluteIdx) {
  const pos = absoluteIdx + 1;
  const valid = state.rewards.filter(r => r.count > 0);
  const atPos = valid.filter(r => pos % r.count === 0).sort((a,b) => b.count - a.count);
  if (atPos.length > 0) return { id: atPos[0].iconId || 'gift', gray: false };
  let best = null, bestNext = Infinity;
  valid.forEach(r => {
    const next = Math.ceil((pos + 1) / r.count) * r.count;
    if (next < bestNext || (next === bestNext && r.count > (best ? best.count : 0))) {
      bestNext = next; best = r;
    }
  });
  return { id: best ? (best.iconId || 'gift') : 'gift', gray: true };
}

// ====== CARD DIMENSIONS ======
function getCardDimensions() {
  const isPortrait = state.cardOrientation === 'portrait';
  const ratio = isPortrait ? (91/55) : (55/91);
  const maxW = isPortrait ? Math.min(window.innerWidth-32,260) : Math.min(window.innerWidth-32,520);
  return { cardW:maxW, cardH:Math.round(maxW*ratio), isPortrait };
}

// ====== RENDER ======
function render() {
  applyBgColor();
  updateTitles();
  renderCounter();
  renderCard();
  renderRewardStatus();
  if (document.getElementById('settings-view').classList.contains('active')) renderSettingsView();
  updateStampBtn();
  updateSettingsBtn();
}

function updateSettingsBtn() {
  const id = inSettings ? 'house' : 'gear';
  document.getElementById('settings-toggle').innerHTML = iconSVG(id, { size:34, badge:true });
}

function applyBgColor() {
  document.body.classList.remove('bg-sky','bg-yellow','bg-pink');
  document.body.classList.add(`bg-${state.bgColor||'sky'}`);
}

function updateTitles() {
  const name = state.cardName || 'Point Card';
  document.getElementById('app-title').textContent = name;
  document.getElementById('card-title-el').textContent = name;
  document.title = name;
}

function renderCounter() {
  document.getElementById('counter-display').innerHTML = `${state.stampCount} <span>個</span>`;
  const next = getNextReward();
  const hint = document.getElementById('next-reward-hint');
  if (next) {
    const nextCount = Math.ceil((state.stampCount + 1) / next.count) * next.count;
    hint.innerHTML = `あと <strong>${nextCount - state.stampCount}個</strong> で「${next.text}」`;
  } else if (state.rewards.length) hint.innerHTML = `🎊 すべての特典を達成！`;
  else hint.textContent = '';
}

function renderCard() {
  const card = document.getElementById('stamp-card');
  THEMES.forEach(t => card.classList.remove(t.cls));
  card.classList.add((THEMES.find(t=>t.id===state.cardTheme)||THEMES[0]).cls);

  const { cardW, cardH } = getCardDimensions();
  const radius = Math.round(Math.min(cardW,cardH)*0.055);
  card.style.width = cardW+'px'; card.style.height = cardH+'px';
  card.style.borderRadius = radius+'px'; card.style.boxSizing = 'border-box';

  const padH = Math.max(10, Math.round(cardW*0.04));
  const padV = Math.max(8,  Math.round(cardH*0.04));
  card.style.padding = `${padV}px ${padH}px`;

  const titleFS = Math.max(10, Math.min(Math.round(cardH*0.075), 15));
  const badgeFS = Math.max(8, Math.round(titleFS*0.8));
  const titleEl = document.getElementById('card-title-el');
  const totalEl = document.getElementById('card-total-label');
  titleEl.style.fontSize = titleFS+'px';
  totalEl.style.fontSize = badgeFS+'px';
  totalEl.style.padding = `${Math.round(badgeFS*.25)}px ${Math.round(badgeFS*.65)}px`;

  const cardPage  = Math.floor(state.stampCount / state.cardSize);
  const posOnCard = state.stampCount % state.cardSize;
  totalEl.textContent = `${posOnCard} / ${state.cardSize}`;

  const headerH  = titleFS * 1.8;
  const gapAfter = Math.round(padV * 0.4);
  const gridAreaW = cardW - padH*2;
  const gridAreaH = cardH - padV*2 - headerH - gapAfter;
  const cols = state.cardCols || 3;
  const rows = Math.ceil(state.cardSize / cols);
  const gap  = Math.max(3, Math.round(Math.min(gridAreaW,gridAreaH)*0.025));
  const maxCellByW = (gridAreaW - (cols-1)*gap) / cols;
  const maxCellByH = (gridAreaH - (rows-1)*gap) / rows;
  const cellSize   = Math.max(16, Math.floor(Math.min(maxCellByW, maxCellByH, 56)));

  const grid = document.getElementById('stamp-grid');
  grid.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
  grid.style.gap = gap+'px';
  grid.innerHTML = '';

  const pageStart    = cardPage * state.cardSize;
  const silSize      = Math.round(cellSize * 0.68);
  const txtFontSize  = Math.max(7, Math.round(cellSize * 0.19));
  const iconSize     = Math.round(cellSize * 0.72);

  for (let i = 0; i < state.cardSize; i++) {
    const cell = document.createElement('div');
    cell.className = 'stamp-cell';
    cell.style.width  = cellSize+'px';
    cell.style.height = cellSize+'px';

    const absoluteIdx = pageStart + i;
    const isStamped   = i < posOnCard;
    if (isStamped) cell.classList.add('stamped');

    const pos = absoluteIdx + 1;
    const allAtPos = state.rewards.filter(r => r.count > 0 && pos % r.count === 0).sort((a,b) => b.count - a.count);
    const rewardHere = allAtPos[0] || null;
    const isReward   = rewardHere !== null;
    const cs = (state.cellStyle||DEFAULT_STATE.cellStyle)[isReward ? 'reward' : 'normal'];
    cell.style.border     = `${cs.borderWidth}px ${cs.borderStyle} ${BORDER_COLOR_MAP[cs.borderColor]||'#c8a850'}`;
    cell.style.background = FILL_COLOR_MAP[cs.fillColor] || 'white';

    if (isReward) {
      cell.classList.add('has-reward');
      const sil = document.createElement('div');
      sil.className = 'reward-silhouette';
      sil.style.width = silSize+'px'; sil.style.height = silSize+'px';
      sil.style.left = sil.style.top = '50%';
      sil.style.transform = 'translate(-50%,-50%)';
      sil.innerHTML = iconSVG(rewardHere.iconId||'gift', { size:silSize, badge:true, gray:false });
      cell.appendChild(sil);

      const txt = document.createElement('div');
      txt.className = 'reward-cell-text';
      const tlen = rewardHere.text.length;
      const dynFS = tlen > 10 ? Math.max(6, Math.round(txtFontSize * 0.68))
                  : tlen > 6  ? Math.max(6, Math.round(txtFontSize * 0.82))
                  : txtFontSize;
      txt.style.fontSize = dynFS + 'px';
      txt.textContent = rewardHere.text;
      cell.appendChild(txt);

      const tip = document.createElement('div');
      tip.className = 'reward-tooltip';
      tip.textContent = rewardHere.text;
      cell.appendChild(tip);

      cell.addEventListener('click', e => {
        e.stopPropagation();
        document.querySelectorAll('.stamp-cell.tooltip-visible').forEach(c => { if(c!==cell) c.classList.remove('tooltip-visible'); });
        cell.classList.toggle('tooltip-visible');
      });
    }

    const iconEl = document.createElement('div');
    iconEl.className = 'stamp-icon';
    iconEl.style.width  = iconSize+'px';
    iconEl.style.height = iconSize+'px';
    if (isStamped) {
      const entry = state.stampIcons[String(absoluteIdx)] || getStampIconForCell(absoluteIdx);
      iconEl.innerHTML = iconSVG(entry.id, { size:iconSize, badge:true, gray:entry.gray });
    }
    cell.appendChild(iconEl);
    grid.appendChild(cell);
  }

  const banner = document.getElementById('card-complete-banner');
  banner.classList.toggle('visible', posOnCard === 0 && state.stampCount > 0);
}

// ====== REWARD STATUS ======
function renderRewardStatus() {
  const section = document.getElementById('reward-status');
  if (!state.rewards.length) { section.innerHTML=''; return; }
  section.innerHTML = '<div class="reward-status-heading">特典</div>';
  [...state.rewards].sort((a,b)=>a.count-b.count).forEach(r => {
    const earned    = r.earnedCount||0, used = r.usedCount||0;
    const available = Math.max(0, earned-used);
    const item = document.createElement('div');
    item.className = 'reward-status-item';

    const iconWrap = document.createElement('div');
    iconWrap.className = 'rs-icon';
    iconWrap.innerHTML = iconSVG(r.iconId||'gift',{size:36,badge:true});
    item.appendChild(iconWrap);

    const info = document.createElement('div');
    info.className = 'rs-info';
    info.innerHTML = `<div class="rs-name">${escHtml(r.text)}</div><div class="rs-meta">(${r.count}個ごと)</div>`;
    item.appendChild(info);

    if (earned > 0) {
      const badge = document.createElement('span');
      badge.className = available >= 1 ? 'rs-count-badge' : 'rs-count-badge rs-count-zero';
      badge.textContent = `×${available}`;
      item.appendChild(badge);
    }

    const btn = document.createElement('button');
    btn.className = 'use-btn';
    btn.textContent = '使う';
    if (available === 0) btn.disabled = true;
    else btn.addEventListener('click', ()=>useReward(r));
    item.appendChild(btn);

    section.appendChild(item);
  });
}

// ====== USE REWARD ======
function useReward(reward) {
  const available = Math.max(0,(reward.earnedCount||0)-(reward.usedCount||0));
  if (available<=0) return;
  if (!confirm(`「${reward.text}」を使いますか？\n（スタンプが ${reward.count} 個減ります）`)) return;
  const idx = state.rewards.findIndex(r=>r.id===reward.id);
  if (idx===-1) return;
  state.rewards[idx].usedCount = (state.rewards[idx].usedCount||0)+1;
  state.stampCount = Math.max(0, state.stampCount-reward.count);
  state.history.push({ ts:Date.now(), action:'use', rewardId:reward.id });
  saveState();
  renderCounter(); renderCard(); renderRewardStatus();
  showMiniToast(`🎉 ${reward.text} を使いました！`);
}

function showMiniToast(msg) {
  const t = document.createElement('div');
  t.className = 'mini-toast'; t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('show')));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); },2500);
}

// ====== STAMP BUTTON ======
function updateStampBtn() {
  const next = getNextReward();
  const id = next ? (next.iconId || 'gift') : 'gift';
  document.getElementById('stamp-btn-icon').innerHTML = iconSVG(id, { size:48, badge:true, gray:false });
}

// ====== CELL STYLE ======
function isLowContrast(borderColorId, fillColorId) {
  const bHex=BORDER_COLOR_MAP[borderColorId], fHex=FILL_COLOR_MAP[fillColorId];
  if (!bHex||!fHex) return false;
  const sum = h => parseInt(h.slice(1,3),16)+parseInt(h.slice(3,5),16)+parseInt(h.slice(5,7),16);
  return Math.abs(sum(bHex)-sum(fHex)) < 100;
}

function renderCellStyleSettings() {
  const container = document.getElementById('cell-style-container');
  container.innerHTML = '';

  const preview = document.createElement('div');
  preview.className = 'cell-style-preview';
  preview.innerHTML = `
    <div class="cell-preview-item"><div class="cell-preview-cell" id="cs-preview-normal"></div><div class="cell-preview-label">通常のマス</div></div>
    <div class="cell-preview-item"><div class="cell-preview-cell" id="cs-preview-reward">特典</div><div class="cell-preview-label">特典のあるマス</div></div>
  `;
  container.appendChild(preview);

  const presetsRow = document.createElement('div');
  presetsRow.className = 'cell-style-presets';
  CELL_STYLE_PRESETS.forEach(preset => {
    const btn = document.createElement('button');
    btn.className = 'preset-btn'; btn.textContent = preset.label;
    btn.addEventListener('click', ()=>{ state.cellStyle={normal:{...preset.normal},reward:{...preset.reward}}; renderCellStyleSettings(); renderCard(); });
    presetsRow.appendChild(btn);
  });
  container.appendChild(presetsRow);

  let activeTab = 'normal';
  const tabs = document.createElement('div'); tabs.className='cell-type-tabs';
  const tabN = document.createElement('button'); tabN.className='cell-type-tab active'; tabN.textContent='通常のマス';
  const tabR = document.createElement('button'); tabR.className='cell-type-tab'; tabR.textContent='特典のあるマス';
  tabs.appendChild(tabN); tabs.appendChild(tabR);
  container.appendChild(tabs);

  const panel = document.createElement('div'); container.appendChild(panel);
  const warning = document.createElement('div'); warning.className='contrast-warning'; warning.textContent='⚠️ 枠の色と塗りつぶしのコントラストが低く、見えにくい場合があります'; container.appendChild(warning);
  const resetBtn = document.createElement('button'); resetBtn.className='reset-defaults-btn'; resetBtn.textContent='↩ 初期設定に戻す';
  resetBtn.addEventListener('click',()=>{ state.cellStyle={normal:{...DEFAULT_STATE.cellStyle.normal},reward:{...DEFAULT_STATE.cellStyle.reward}}; renderCellStyleSettings(); renderCard(); });
  container.appendChild(resetBtn);

  function buildOptionRow(label, options, cur, onChange) {
    const row=document.createElement('div'); row.className='cell-option-row';
    const lbl=document.createElement('div'); lbl.className='cell-option-label'; lbl.textContent=label; row.appendChild(lbl);
    const btns=document.createElement('div'); btns.className='cell-option-btns';
    options.forEach(opt=>{ const btn=document.createElement('button'); btn.className=`cell-option-btn${String(opt.id)===String(cur)?' selected':''}`; btn.textContent=opt.label; btn.addEventListener('click',()=>{ btns.querySelectorAll('.cell-option-btn').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); onChange(opt.id); }); btns.appendChild(btn); });
    row.appendChild(btns); return row;
  }
  function buildColorRow(label, colors, cur, onChange) {
    const row=document.createElement('div'); row.className='cell-option-row';
    const lbl=document.createElement('div'); lbl.className='cell-option-label'; lbl.textContent=label; row.appendChild(lbl);
    const btns=document.createElement('div'); btns.className='cell-option-btns';
    colors.forEach(c=>{ const btn=document.createElement('button'); btn.className=`cell-color-btn${c.id===cur?' selected':''}`; btn.style.background=c.hex; btn.title=c.label; btn.addEventListener('click',()=>{ btns.querySelectorAll('.cell-color-btn').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); onChange(c.id); }); btns.appendChild(btn); });
    row.appendChild(btns); return row;
  }
  function updatePreview() {
    ['normal','reward'].forEach(type=>{ const el=document.getElementById(`cs-preview-${type}`); if(!el) return; const s=state.cellStyle[type]; el.style.border=`${s.borderWidth}px ${s.borderStyle} ${BORDER_COLOR_MAP[s.borderColor]||'#c8a850'}`; el.style.background=FILL_COLOR_MAP[s.fillColor]||'white'; }); }
  function updateWarning() { const s=state.cellStyle[activeTab]; warning.classList.toggle('visible', isLowContrast(s.borderColor,s.fillColor)); }
  function renderPanel() {
    panel.innerHTML=''; const s=state.cellStyle[activeTab];
    panel.appendChild(buildOptionRow('枠の種類',[{id:'solid',label:'実線'},{id:'dashed',label:'点線'}],s.borderStyle,val=>{state.cellStyle[activeTab].borderStyle=val;updatePreview();updateWarning();renderCard();}));
    panel.appendChild(buildColorRow('枠の色',BORDER_COLORS,s.borderColor,val=>{state.cellStyle[activeTab].borderColor=val;updatePreview();updateWarning();renderCard();}));
    panel.appendChild(buildOptionRow('枠の太さ',[{id:1,label:'細い(1px)'},{id:2,label:'ふつう(2px)'},{id:3,label:'太い(3px)'},{id:4,label:'とても太い(4px)'}],s.borderWidth,val=>{state.cellStyle[activeTab].borderWidth=val;updatePreview();updateWarning();renderCard();}));
    panel.appendChild(buildColorRow('塗りつぶし',FILL_COLORS,s.fillColor,val=>{state.cellStyle[activeTab].fillColor=val;updatePreview();updateWarning();renderCard();}));
  }
  function switchTab(type) { activeTab=type; tabN.classList.toggle('active',type==='normal'); tabR.classList.toggle('active',type==='reward'); renderPanel(); updateWarning(); }
  tabN.addEventListener('click',()=>switchTab('normal'));
  tabR.addEventListener('click',()=>switchTab('reward'));
  renderPanel(); updatePreview(); updateWarning();
}

// ====== SETTINGS ======
function renderSettingsView() {
  document.getElementById('card-name-input').value = state.cardName||'';
  document.getElementById('card-size-input').value = state.cardSize;

  // orientation
  const orientPicker = document.getElementById('orientation-picker'); orientPicker.innerHTML='';
  [{id:'landscape',label:'横型  ▭'},{id:'portrait',label:'縦型  ▯'}].forEach(o=>{
    const btn=document.createElement('button'); btn.className=`orient-btn${state.cardOrientation===o.id?' selected':''}`;
    btn.textContent=o.label; btn.addEventListener('click',()=>{ orientPicker.querySelectorAll('.orient-btn').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); state.cardOrientation=o.id; renderCard(); }); orientPicker.appendChild(btn);
  });

  // theme
  const themePicker=document.getElementById('theme-picker'); themePicker.innerHTML='';
  THEMES.forEach(t=>{ const item=document.createElement('div'); item.className=`picker-item theme-swatch ${t.cls}${state.cardTheme===t.id?' selected':''}`; item.title=t.label; item.addEventListener('click',()=>{ document.querySelectorAll('#theme-picker .picker-item').forEach(e=>e.classList.remove('selected')); item.classList.add('selected'); state.cardTheme=t.id; renderCard(); }); themePicker.appendChild(item); });

  // bg
  const bgPicker=document.getElementById('bg-picker'); bgPicker.innerHTML='';
  BG_COLORS.forEach(b=>{ const item=document.createElement('div'); item.className=`picker-item theme-swatch ${b.cls}${state.bgColor===b.id?' selected':''}`; item.title=b.label; item.addEventListener('click',()=>{ document.querySelectorAll('#bg-picker .picker-item').forEach(e=>e.classList.remove('selected')); item.classList.add('selected'); state.bgColor=b.id; applyBgColor(); }); bgPicker.appendChild(item); });

  // cols
  const colsPicker=document.getElementById('cols-picker'); colsPicker.innerHTML='';
  [2,3,4,5,6].forEach(n=>{ const btn=document.createElement('button'); btn.className=`cols-btn${state.cardCols===n?' selected':''}`; btn.textContent=n; btn.addEventListener('click',()=>{ colsPicker.querySelectorAll('.cols-btn').forEach(e=>e.classList.remove('selected')); btn.classList.add('selected'); state.cardCols=n; renderCard(); }); colsPicker.appendChild(btn); });

  // reward list
  renderRewardList();
  renderNewIconPicker();
  renderCellStyleSettings();
}

function renderNewIconPicker() {
  const container = document.getElementById('new-icon-picker');
  container.innerHTML = '';
  const lbl = document.createElement('div'); lbl.style.cssText='font-size:12px;color:#aaa;margin-bottom:6px;'; lbl.textContent='アイコン：';
  container.appendChild(lbl);
  const grid = document.createElement('div'); grid.className='icon-picker-grid';
  let selectedId = REWARD_ICONS[0].id;
  REWARD_ICONS.forEach(ic => {
    const item = document.createElement('div'); item.className='icon-pick-item';
    const btn  = document.createElement('button'); btn.className=`icon-pick-btn${ic.id===selectedId?' selected':''}`; btn.type='button';
    btn.innerHTML = iconSVG(ic.id, { size:36, badge:true });
    btn.title = ic.desc;
    btn.addEventListener('click', () => {
      grid.querySelectorAll('.icon-pick-btn').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); selectedId=ic.id;
    });
    const lbl2 = document.createElement('div'); lbl2.className='icon-pick-label'; lbl2.textContent=ic.desc;
    item.appendChild(btn); item.appendChild(lbl2); grid.appendChild(item);
  });
  container.appendChild(grid);

  document.getElementById('add-reward-btn').onclick = () => {
    const countEl = document.getElementById('new-reward-count');
    const textEl  = document.getElementById('new-reward-text');
    const count = parseInt(countEl.value), text = textEl.value.trim();
    if (!count||count<1||!text) { countEl.style.borderColor=count?'#eee':'var(--primary)'; textEl.style.borderColor=text?'#eee':'var(--primary)'; return; }
    countEl.style.borderColor=textEl.style.borderColor='#eee';
    state.rewards.push({ id:state._nextRewardId++, count, text, iconId:selectedId, earnedCount:Math.floor(state.stampCount/count), usedCount:0 });
    countEl.value=textEl.value='';
    renderRewardList();
    renderNewIconPicker();
  };
}

function renderRewardList() {
  const list = document.getElementById('reward-list');
  list.innerHTML = '';
  [...state.rewards].sort((a,b)=>a.count-b.count).forEach(r => {
    const item = document.createElement('div'); item.className='reward-item';
    item.innerHTML = `
      <div class="reward-icon-preview">${iconSVG(r.iconId||'gift',{size:32,badge:true})}</div>
      <span class="reward-count-badge">${r.count}個ごと</span>
      <span class="reward-text">${escHtml(r.text)}</span>
      <button class="reward-edit-btn" title="編集">✏️</button>
      <button class="reward-del-btn"  title="削除">🗑</button>
      <div class="inline-edit">
        <div class="inline-icon-picker" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px;"></div>
        <div class="inline-edit-inputs">
          <input type="number" class="edit-count" value="${r.count}" min="1" style="width:60px">
          <input type="text" class="edit-text" value="${escHtml(r.text)}" style="flex:1">
          <button class="inline-save-btn">保存</button>
        </div>
      </div>
    `;

    let editIconId = r.iconId||'gift';
    const iconPicker = item.querySelector('.inline-icon-picker');
    REWARD_ICONS.forEach(ic => {
      const btn = document.createElement('button'); btn.type='button';
      btn.style.cssText='width:34px;height:34px;border-radius:8px;border:2.5px solid transparent;background:none;padding:0;cursor:pointer;transition:all .1s;';
      if (ic.id===editIconId) btn.style.borderColor='var(--primary)';
      btn.innerHTML = iconSVG(ic.id,{size:28,badge:true}); btn.title=ic.desc;
      btn.addEventListener('click',()=>{ iconPicker.querySelectorAll('button').forEach(b=>b.style.borderColor='transparent'); btn.style.borderColor='var(--primary)'; editIconId=ic.id; item.querySelector('.reward-icon-preview').innerHTML=iconSVG(editIconId,{size:32,badge:true}); });
      iconPicker.appendChild(btn);
    });

    item.querySelector('.reward-edit-btn').addEventListener('click',()=>item.classList.toggle('editing'));
    item.querySelector('.inline-save-btn').addEventListener('click',()=>{
      const nc=parseInt(item.querySelector('.edit-count').value), nt=item.querySelector('.edit-text').value.trim();
      if (!nc||!nt) return;
      const idx=state.rewards.findIndex(x=>x.id===r.id);
      if (idx!==-1) { state.rewards[idx].count=nc; state.rewards[idx].text=nt; state.rewards[idx].iconId=editIconId; }
      renderRewardList();
    });
    item.querySelector('.reward-del-btn').addEventListener('click',()=>{ state.rewards=state.rewards.filter(x=>x.id!==r.id); renderRewardList(); });
    list.appendChild(item);
  });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ====== STAMP ACTION ======
function doStamp(btnEl) {
  btnEl.classList.remove('pressing'); void btnEl.offsetWidth; btnEl.classList.add('pressing');
  const ripple=document.createElement('div'); ripple.className='ripple'; const sz=btnEl.offsetWidth;
  ripple.style.cssText=`width:${sz}px;height:${sz}px;left:0;top:0;`;
  btnEl.appendChild(ripple); ripple.addEventListener('animationend',()=>ripple.remove());
  spawnParticles(btnEl);

  const absIdx = state.stampCount;
  const entry  = getStampIconForCell(absIdx);

  state.stampCount++;
  state.stampIcons[String(absIdx)] = entry;
  state.history.push({ ts:Date.now(), action:'stamp' });
  saveState();
  renderCounter(); renderCard(); renderRewardStatus();
  updateStampBtn();

  const grid=document.getElementById('stamp-grid');
  const targetIdx=(state.stampCount-1)%state.cardSize;
  const cells=grid.querySelectorAll('.stamp-cell');
  if (cells[targetIdx]) {
    cells[targetIdx].classList.add('just-stamped');
    const icon=cells[targetIdx].querySelector('.stamp-icon');
    if (icon) icon.addEventListener('animationend',()=>cells[targetIdx].classList.remove('just-stamped'),{once:true});
  }
  checkAndShowReward(state.stampCount);
}

function checkAndShowReward(count) {
  if (count<=0) return;
  const hits = state.rewards.filter(r => r.count > 0 && count % r.count === 0).sort((a,b) => b.count - a.count);
  if (!hits.length) return;
  const winner = hits[0];
  winner.earnedCount = (winner.earnedCount||0) + 1;
  saveState(); renderRewardStatus();
  setTimeout(() => showRewardModal(winner), 400);
}

function showRewardModal(reward) {
  const modal=document.getElementById('reward-modal');
  document.getElementById('modal-icon').innerHTML = iconSVG(reward.iconId||'gift',{size:72,badge:true});
  document.getElementById('modal-reward-text').textContent = reward.text;
  modal.style.display='flex';
  setTimeout(()=>modal.classList.add('visible'),10);
  launchConfetti();
  document.getElementById('modal-close-btn').onclick=()=>{ modal.classList.remove('visible'); setTimeout(()=>{modal.style.display='none';},350); };
}

function launchConfetti() {
  const c=document.getElementById('confetti-container'); c.innerHTML='';
  const cols=['#ff6b9d','#ffd93d','#6bcb77','#4ecdc4','#c2a8ff','#ff9a9e','#ffb347'];
  for (let i=0;i<80;i++) {
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.cssText=`left:${Math.random()*100}%;background:${cols[Math.floor(Math.random()*cols.length)]};width:${6+Math.random()*8}px;height:${10+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'3px'};animation-duration:${1.2+Math.random()*1.8}s;animation-delay:${Math.random()*.6}s;--drift:${(Math.random()-.5)*120}px;`;
    c.appendChild(p); p.addEventListener('animationend',()=>p.remove());
  }
}

function spawnParticles(btnEl) {
  const rect=btnEl.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  const shapes=['✨','⚡','💥','🌟'];
  for (let i=0;i<8;i++) {
    const p=document.createElement('div'); p.className='particle';
    const a=(i/8)*Math.PI*2, d=80+Math.random()*60;
    p.style.cssText=`left:${cx}px;top:${cy}px;--px:${Math.cos(a)*d}px;--py:${Math.sin(a)*d-40}px;animation-delay:${Math.random()*.1}s;`;
    p.textContent=shapes[Math.floor(Math.random()*shapes.length)];
    document.body.appendChild(p); p.addEventListener('animationend',()=>p.remove());
  }
}

// ====== VIEW TOGGLE ======
let inSettings = false;
document.getElementById('settings-toggle').addEventListener('click', ()=>{
  inSettings=!inSettings;
  document.getElementById('main-view').classList.toggle('hidden',inSettings);
  document.getElementById('settings-view').classList.toggle('active',inSettings);
  document.getElementById('stamp-btn-area').style.display=inSettings?'none':'flex';
  updateSettingsBtn();
  if (inSettings) renderSettingsView();
});

document.addEventListener('click',()=>{ document.querySelectorAll('.stamp-cell.tooltip-visible').forEach(c=>c.classList.remove('tooltip-visible')); });

// ====== STAMP BUTTON ======
document.getElementById('stamp-btn').addEventListener('click', function(){ doStamp(this); });

// ====== SETTINGS SAVE ======
document.getElementById('save-settings-btn').addEventListener('click', ()=>{
  const newName=document.getElementById('card-name-input').value.trim();
  const newSize=parseInt(document.getElementById('card-size-input').value);
  if (newName) state.cardName=newName;
  if (newSize>=3&&newSize<=50) state.cardSize=newSize;
  saveState();
  const btn=document.getElementById('save-settings-btn');
  btn.textContent='✅ 保存しました！';
  setTimeout(()=>{ btn.textContent='✅ 設定を保存'; },1500);
  inSettings=false;
  document.getElementById('main-view').classList.remove('hidden');
  document.getElementById('settings-view').classList.remove('active');
  document.getElementById('stamp-btn-area').style.display='flex';
  render();
});

// ====== RESET ======
document.getElementById('reset-stamps-btn').addEventListener('click', ()=>{
  if (!confirm('スタンプをすべてリセットしますか？\n（特典の獲得・使用記録もリセットされます）')) return;
  state.stampCount=0; state.history=[]; state.stampIcons={};
  state.rewards=state.rewards.map(r=>({...r,earnedCount:0,usedCount:0}));
  saveState();
  inSettings=false;
  document.getElementById('main-view').classList.remove('hidden');
  document.getElementById('settings-view').classList.remove('active');
  document.getElementById('stamp-btn-area').style.display='flex';
  render();
});

// ====== RESIZE ======
let resizeTimer;
window.addEventListener('resize', ()=>{ clearTimeout(resizeTimer); resizeTimer=setTimeout(renderCard,100); });

// ====== INIT ======
render();
</script>
